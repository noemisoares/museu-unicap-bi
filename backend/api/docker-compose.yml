# PostgreSQL local para desenvolvimento. Usa as mesmas variáveis do .env.
services:
  postgres:
    image: postgres:16
    container_name: museu-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-museu}
      POSTGRES_USER: ${DB_USER:-museu_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - museu-pgdata:/var/lib/postgresql/data

volumes:
  museu-pgdata:
