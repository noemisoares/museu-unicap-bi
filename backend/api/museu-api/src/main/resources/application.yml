server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: museu-unicap-bi
  datasource:
    # Credenciais NUNCA ficam no código: vêm de variáveis de ambiente (ver .env.example).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:museu}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      # Permite a aplicação iniciar mesmo sem banco disponível (a conexão é feita no primeiro uso).
      # Útil nesta fase de estrutura; revisar quando houver regras que dependam do banco no startup.
      initialization-fail-timeout: -1

app:
  cors:
    # Origens dos front-ends (totem e painel), separadas por vírgula. Ajustar por ambiente.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    br.unicap.museu: ${LOG_LEVEL:INFO}
